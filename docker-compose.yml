name: starforge-console

services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
    image: "${CONSOLE_IMAGE:-starforge-console:1.0.0}"
    environment:
      API_UPSTREAM: "${API_UPSTREAM:?Set API_UPSTREAM to the verified HTTPS backend origin}"
    user: "101:101"
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
