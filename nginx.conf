worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Exclude query strings, credentials, referrers, and user-agent details
    # from the container log while retaining latency and request correlation.
    log_format console '$remote_addr [$time_iso8601] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time '
                       'request_id=$http_x_request_id '
                       'upstream_request_id=$upstream_http_x_request_id';
    access_log /dev/stdout console;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    # Nginx does not verify HTTPS proxy certificates unless asked explicitly.
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;

    # The runtime container has a read-only root filesystem. Any temporary
    # request/proxy data is constrained to the Compose-managed /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # This is a private administrative console. TLS and HSTS are owned by
        # the external HTTPS edge; these defense-in-depth headers apply here.
        # The runtime is pinned above Nginx 1.29.3 so child locations can merge
        # cache controls without dropping the server-level security headers.
        add_header_inherit merge;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), display-capture=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Same-origin REST proxy. API_UPSTREAM must be an HTTPS origin without
        # a trailing slash so the original /api/... URI is preserved.
        location /api/ {
            proxy_pass ${API_UPSTREAM};
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_ssl_server_name on;
            proxy_ssl_name $proxy_host;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $proxy_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store" always;
        }

        # Backend notifications and attendance use WebSockets. Messaging
        # threads currently remain REST + notification/refetch.
        location /ws/ {
            proxy_pass ${API_UPSTREAM};
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name $proxy_host;
            proxy_set_header Host $proxy_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $proxy_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 65s;
        }

        # Vite emits content-hashed assets, which are safe to cache long-term.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location = /favicon.svg {
            expires 7d;
            try_files $uri =404;
        }

        # Never retain the application shell across releases.
        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
