name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ""
      VITE_USE_MOCK: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the release npm version
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify production builds reject fixture mode
        env:
          VITE_USE_MOCK: "true"
        run: |
          if output="$(npm run build 2>&1)"; then
            echo "Fixture-enabled production build unexpectedly succeeded." >&2
            exit 1
          fi
          grep -Fq "Production bundles require VITE_USE_MOCK=false." <<<"$output"

      - name: Build production bundle
        run: npm run build

      - name: Audit dependencies
        run: |
          npm run audit:all
          npm run audit:production

      - name: Verify checks did not mutate tracked files
        run: git diff --exit-code

      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-verification
          path: |
            coverage/
            dist/
          if-no-files-found: error
          retention-days: 7

  container-smoke:
    name: Build and smoke-test container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build production image
        run: >-
          docker build
          --build-arg VITE_USE_MOCK=false
          --tag starforge-console:ci
          .

      - name: Smoke-test unprivileged runtime
        shell: bash
        run: |
          set -euo pipefail

          assert_rejected_upstream() {
            local value="$1"
            local output
            if output="$(
              timeout 5s docker run --rm \
                --read-only \
                --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
                --cap-drop ALL \
                --security-opt no-new-privileges:true \
                --env "API_UPSTREAM=$value" \
                starforge-console:ci 2>&1
            )"; then
              echo "Unsafe API_UPSTREAM value was unexpectedly accepted." >&2
              exit 1
            fi
            grep -Fq "API_UPSTREAM must be one HTTPS origin" <<<"$output"
          }

          assert_rejected_upstream $'https://starforge.78.111.91.113.nip.io\nworker_processes 1;'
          assert_rejected_upstream 'https://starforge.78.111.91.113.nip.io:65536'

          container_id="$(
            docker run --detach \
              --init \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
              --cap-drop ALL \
              --pids-limit 100 \
              --security-opt no-new-privileges:true \
              --env API_UPSTREAM=https://starforge.78.111.91.113.nip.io \
              --publish 18080:8080 \
              starforge-console:ci
          )"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_id" || true
            fi
            docker rm --force "$container_id" >/dev/null 2>&1 || true
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 1
          done

          test "$(docker exec "$container_id" id -u)" != "0"

          api_headers="$(
            curl \
              --dump-header - \
              --fail \
              --output /dev/null \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              http://127.0.0.1:18080/api/schema/
          )"
          grep -qi '^Cache-Control: no-store' <<<"$api_headers"

          headers="$(curl --fail --silent --show-error --head http://127.0.0.1:18080/index.html)"
          grep -qi '^Cache-Control: no-cache' <<<"$headers"
          grep -qi "^Content-Security-Policy: default-src 'self'" <<<"$headers"
          grep -qi '^Cross-Origin-Resource-Policy: same-origin' <<<"$headers"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -qi '^X-Frame-Options: DENY' <<<"$headers"
          grep -qi '^X-Robots-Tag: noindex, nofollow, noarchive' <<<"$headers"
